<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;

}

/* ---------- NAVBAR ---------- */
header {
    background: #1e3a8a;
    color: white;
    padding: 15px 30px;
    position: sticky;
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 5px;
    transition: background 0.3s;
}

nav a:hover {
    background: #2563eb;
}

/* ---------- GALLERY ---------- */
section {
    width: 90%;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

section h2 {
    color: #1e3a8a;
    margin-bottom: 20px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
}

.gallery-grid img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.3s;
}

.gallery-grid img:hover {
    transform: scale(1.05);
}

/* ---------- LIGHTBOX ---------- */
#lightbox {
    position: fixed;
    display: none;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 10000;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
}

#lightbox span {
    position: absolute;
    top: 20px;
    right: 40px;
    color: white;
    font-size: 40px;
    cursor: pointer;
}

/* Responsive */
@media screen and (max-width: 480px) {
    section {
        padding: 15px;
    }
    nav a {
        font-size: 14px;
        padding: 6px 10px;
    }
}
</style>

<script>
function openLightbox(img) {
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;
}

function closeLightbox(e) {
    if(e.target.id === 'lightbox' || e.target.tagName === 'SPAN'){
        document.getElementById('lightbox').style.display = 'none';
    }
}
</script>
